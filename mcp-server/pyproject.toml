[project]
name = "kimbiseo"
version = "0.1.0"
description = "김비서 사내 시스템 연결 (MCP 서버 + 연결 관리 명령어)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=2.3.0",
    "platformdirs>=4.13.5",
    "requests>=2.34.2",
    "requests-ntlm>=1.3.0",
]

[project.scripts]
kimbiseo = "kimbiseo:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
